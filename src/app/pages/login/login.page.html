<ion-header [translucent]="true">
  <ion-toolbar color="danger">
    <ion-title>Inicio de Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content ion-padding">
  <div class="auth-wrapper">
    <ion-card class="auth-card">
      <ion-card-header class="ion-text-center">
        <div class="icon-circle">
          <ion-icon name="lock-closed"></ion-icon>
        </div>
        <ion-card-title class="auth-title">Acceso al Sistema</ion-card-title>
        <ion-card-subtitle class="auth-subtitle">Reportes Quito - Incidencias Urbanas</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        @if (mensajeError()) {
          <div class="error-banner">
            <ion-icon name="alert-circle-outline"></ion-icon>
            <span>{{ mensajeError() }}</span>
          </div>
        }

        <div class="form-group">
          <ion-item lines="none" class="custom-input-item">
            <ion-icon name="mail-outline" slot="start" color="danger"></ion-icon>
            <ion-input 
              type="email" 
              label="Correo electrónico" 
              labelPlacement="floating" 
              placeholder="ejemplo@correo.com" 
              [(ngModel)]="email"
              (keyup.enter)="iniciarSesion()">
            </ion-input>
          </ion-item>

          <ion-item lines="none" class="custom-input-item">
            <ion-icon name="lock-closed-outline" slot="start" color="danger"></ion-icon>
            <ion-input 
              [type]="mostrarPassword() ? 'text' : 'password'" 
              label="Contraseña" 
              labelPlacement="floating" 
              placeholder="Ingresa tu contraseña" 
              [(ngModel)]="password"
              (keyup.enter)="iniciarSesion()">
            </ion-input>
            <ion-button fill="clear" slot="end" (click)="togglePassword()" class="eye-btn" color="medium">
              <ion-icon [name]="mostrarPassword() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-item>
        </div>

        <div class="action-buttons">
          <ion-button 
            expand="block" 
            color="danger" 
            class="submit-btn" 
            (click)="iniciarSesion()" 
            [disabled]="cargando()">
            @if (cargando()) {
              <ion-spinner name="crescent"></ion-spinner>
            } @else {
              <ion-icon name="log-in-outline" slot="start"></ion-icon>
              Iniciar Sesión
            }
          </ion-button>

          <div class="divider">
            <span>¿No tienes una cuenta?</span>
          </div>

          <ion-button 
            expand="block" 
            fill="outline" 
            color="danger" 
            class="register-btn" 
            routerLink="/register">
            <ion-icon name="person-add-outline" slot="start"></ion-icon>
            Registrarse
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
